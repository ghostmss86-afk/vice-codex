name: Auto-Ingest High-Traffic GTA 6 Videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-ingest-videos.yml'
      - 'config/ingest-rules.json'
  schedule:
    # Runs every 30 minutes in the cloud; only commits & deploys when new qualifying videos are found
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      per_query:
        description: 'Override candidates per query (leave empty for auto bootstrap/maintenance)'
        required: false
        default: ''
  repository_dispatch:
    types: [new-gta6-video]

permissions:
  contents: write

concurrency:
  group: vice-codex-auto-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Run cloud weighted auto-ingest engine
        env:
          PER_QUERY_OVERRIDE: ${{ github.event.inputs.per_query || '' }}
        run: python scripts/ingest_videos.py

      - name: Auto-commit & trigger live deploy only if new quality videos were added
        run: |
          if git diff --quiet data/videos.json; then
            echo "No new qualifying videos detected. Skipping commit & deploy."
            exit 0
          fi
          COUNT=$(python -c "import json; print(len(json.load(open('data/videos.json'))['videos']))")
          git config user.name "vice-codex-bot"
          git config user.email "vice-codex-bot@users.noreply.github.com"
          git add data/videos.json
          git commit -m "chore(auto-ingest): publish cloud video batch (cloud pool: ${COUNT})"
          git push origin main
